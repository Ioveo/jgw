name: OCI Auto Grabber (甲骨文全自动抢机)

on:
  schedule:
    # UTC 时间每 30 分钟执行一次（北京时间 = UTC+8）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支持手动在 Actions 页面一键触发

jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 28   # 强制 28 分钟后超时退出，防止卡住占用下一轮

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: true

      - name: Build CLI
        run: go build -o oci-grabber-cli .

      - name: 🚀 Start Grabbing
        # 所有配置通过环境变量注入，程序检测不到 config.toml 时自动读取这些变量
        env:
          # ── 鉴权 (必填，存入 GitHub Secrets) ──────────────────────────────
          OCI_TENANCY_OCID:           ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID:              ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT:            ${{ secrets.OCI_FINGERPRINT }}
          # 将你的 .pem 文件全文内容（含 BEGIN/END 行）粘贴到 Secret 中
          OCI_PRIVATE_KEY_CONTENT:    ${{ secrets.OCI_PRIVATE_KEY_CONTENT }}
          OCI_REGION:                 ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_ID:         ${{ secrets.OCI_COMPARTMENT_ID }}
          OCI_SSH_PUBLIC_KEY:         ${{ secrets.OCI_SSH_PUBLIC_KEY }}

          # ── 实例规格 (可在此直接修改，无需放入 Secrets) ───────────────────
          OCI_DISPLAY_NAME:           "free-arm-github-01"
          OCI_SHAPE:                  "VM.Standard.A1.Flex"
          OCI_OCPUS:                  "4"
          OCI_MEMORY_GB:              "24"
          OCI_ASSIGN_PUBLIC_IP:       "true"

          # 留空 → 程序自动搜索匹配过滤条件的镜像 + 默认子网
          OCI_IMAGE_ID:               ""
          # 镜像名称过滤器（例如 "ubuntu 22.04"，支持空格分隔多关键字模糊匹配。留空默认匹配 "ubuntu"）
          OCI_IMAGE_FILTER:           "ubuntu 22.04"
          OCI_SUBNET_ID:              ""

          # ── 调度参数 ──────────────────────────────────────────────────────
          # 每轮 Action 尝试抢机，配合 30 分钟 cron 无缝轮转
          OCI_INTERVAL_SECONDS:       "120"  # 初始间隔提高到 120 秒，降低初期 429 概率
          OCI_JITTER_SECONDS:         "15"   # 随机抖动时间
          OCI_MAX_BACKOFF_SECONDS:    "300"  # 发生 429 限流时，最大退避时间提高到 5 分钟，确保能解除限流
          OCI_MAX_ATTEMPTS:           "12"   # 每轮最多尝试 12 次，配合 2 分钟初始间隔和退避算法，刚好运行约 25 分钟

          # ── 通知 (可选，填入 Secrets) ─────────────────────────────────────
          OCI_WEBHOOK_URL:            ${{ secrets.OCI_WEBHOOK_URL }}
          OCI_TG_BOT_TOKEN:           ${{ secrets.OCI_TG_BOT_TOKEN }}
          OCI_TG_CHAT_ID:             ${{ secrets.OCI_TG_CHAT_ID }}

        # 不传 -config，程序找不到默认的 config.toml 后自动切换到环境变量模式
        run: ./oci-grabber-cli
