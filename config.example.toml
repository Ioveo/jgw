[auth]
tenancy_ocid     = "ocid1.tenancy.oc1..aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
user_ocid        = "ocid1.user.oc1..aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
fingerprint      = "xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx:xx"
private_key_path = "./oci_private_key.pem"
region           = "ap-tokyo-1"

[instance]
# compartment_id 通常与 tenancy_ocid 相同（根账号默认 compartment）
compartment_id   = "ocid1.tenancy.oc1..aaaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
# 留空则自动轮询该 Region 下所有可用域
availability_domain = ""
display_name     = "free-arm-01"
shape            = "VM.Standard.A1.Flex"
ocpus            = 4
memory_gb        = 24
# 镜像 ID 与 过滤器二选一
# 1. 直接指定 image_id (最稳妥，一旦指定则忽略下面的过滤器)
image_id         = ""
# 2. 留空 image_id 触发自动发现，并在此指定匹配关键字 (如 "ubuntu 22.04" 或 "ubuntu-22.04")，留空默认匹配 "ubuntu"
image_filter     = "ubuntu 22.04"
subnet_id        = "ocid1.subnet.oc1.ap-tokyo-1.aaaaaaaXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX"
assign_public_ip = true
ssh_public_key   = "ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC..."

[scheduler]
interval_seconds    = 60    # 基础轮询间隔（秒），建议 >= 30 避免触发限流
jitter_seconds      = 15    # 每次请求附加随机抖动（秒）
max_backoff_seconds = 600   # 连续失败时最大退避上限（秒）
max_attempts        = 0     # 0 表示无限重试直到成功

[notify]
# Webhook URL（支持企微/钉钉机器人，留空则仅打印日志）
webhook_url = ""
# Telegram Bot（可选）
telegram_bot_token = ""
telegram_chat_id   = ""
